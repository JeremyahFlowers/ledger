<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ledger</title>
  <meta name="description" content="Spaced-repetition tracker, weak-pattern dashboard, and mock-interview trainer for coding interview prep." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#123B3A" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- The nav is two rows of buttons, so without this a keyboard user tabs
       through every chapter and every page link before reaching the content —
       on every single view change. -->
  <a class="skip-link" href="#view-root">Skip to content</a>
  <header class="topbar">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true">{ }</span> Ledger</h1>
    <div class="row gap-sm" style="align-items:center">
      <span id="plant-indicator" class="topbar-plant"></span>
      <!-- Search is the fastest way to anything, so it gets a visible control
           rather than living only behind a keystroke. -->
      <button id="search-button" class="topbar-icon-button" type="button"
              title="Search (/)" aria-label="Search"></button>
      <!-- A shortcut nobody knows about may as well not exist. -->
      <button id="shortcut-hint" class="shortcut-hint" type="button"
              title="Keyboard shortcuts">Press <kbd>?</kbd></button>
      <span id="sync-status" class="status"></span>
    </div>
  </header>
  <nav id="tab-nav" class="tab-nav" aria-label="Sections" hidden></nav>
  <main id="view-root" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <!-- Switching view swaps the whole of <main> with no page load, which a
       screen reader is otherwise given no indication of. -->
  <div id="view-announcer" class="visually-hidden" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
